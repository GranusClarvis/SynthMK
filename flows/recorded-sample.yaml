# Recorded by the SynthMK Chrome recorder. Review selectors/values before
# committing; templatize secrets as {{ ENV_NAME }} (see docs/flow-schema.md).
name: "Recorded Demo Flow"
start_url: "{{ SYNTHMK_DEMO_URL }}"
timeout_ms: 30000
warn_ms: 3000
crit_ms: 7000
browser: chrome
screenshot_on_failure: true
steps:
  - action: open_url
    url: "{{ SYNTHMK_DEMO_URL }}"
  - action: fill
    selector: "#username"
    value: "{{ DEMO_USER }}"
  - action: fill
    selector: "#password"
    value: "{{ DEMO_PASS }}"
  - action: click
    selector: "#submit"
  - action: wait_for_element
    selector: "[data-testid=\"dashboard\"]"
    timeout_ms: 5000
  - action: check_visible_text
    text: "Account Overview"
  - action: check_title
    contains: "SynthMK Demo"
