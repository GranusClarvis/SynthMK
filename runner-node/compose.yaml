# SynthMK runner-node — PRODUCTION deployment template.
#
#   cp compose.yaml /srv/synthmk/compose.yaml   # then edit the marked lines
#   docker compose up -d
#
# This is the hardened single-node deployment: resource limits sized for the
# default 4-way browser concurrency, privileges dropped, screenshots
# token-authenticated. The LAN lab variant lives in lab/docker-compose.yml.
#
# Network exposure contract (firewall accordingly):
#   tcp/6556  agent transport — ONLY the Checkmk server needs to reach it
#   tcp/9180  screenshots     — only operators' browsers need to reach it
#
# To upgrade to the TLS agent transport, see runner-node/register_agent.sh.
name: synthmk-node

services:
  synthmk-runner:
    image: synthmk-runner:0.4.0
    # Or build from a checkout:
    # build: { context: .., dockerfile: runner-node/Dockerfile }
    container_name: synthmk-runner
    hostname: synthmk-runner          # = the Checkmk host name of this node
    environment:
      # EDIT: base URL operators' browsers use for screenshot links.
      - SYNTHMK_SHOT_BASE_URL=http://synthmk-runner.example.lan:9180
      # Browser runs in parallel; ~1-1.5 GB RSS each at peak. 4 fits the 6g
      # limit below; raise both together (see docs/scaling.md).
      - SYNTHMK_MAX_CONCURRENCY=4
      # Secrets for {{ secret.* }} (mount below; chmod 600 on the host).
      - SYNTHMK_SECRETS_FILE=/run/synthmk/secrets.yaml
      # Production transport after register_agent.sh: flip to "official".
      - SYNTHMK_AGENT_MODE=socat
      # Management dashboard (:9181). Unset = auto-generated token printed
      # once to the container log; SYNTHMK_ADMIN=off disables the dashboard.
      # - SYNTHMK_ADMIN_TOKEN=change-me
      # Optional read-only dashboard sign-in (live table + history, no writes).
      # - SYNTHMK_VIEWER_TOKEN=change-me-too
      # Audit trail of dashboard actions (JSONL; tail it into your SIEM).
      # - SYNTHMK_AUDIT_LOG=/var/log/synthmk-audit.log
      # Allow `type: script` flows (operator Python with full page access).
      # Enable only when everyone who can write flows may run code as pwuser.
      # - SYNTHMK_ALLOW_SCRIPTS=1
    volumes:
      - ./flows:/opt/synthmk/flows:ro                          # EDIT: your flow files
      - ./flows.conf:/opt/synthmk/runner-node/flows.conf:ro    # EDIT: your schedule
      - ./secrets.yaml:/run/synthmk/secrets.yaml:ro            # EDIT: chmod 600
      - synthmk-shots:/opt/synthmk/screenshots
      - cmk-agent-state:/var/lib/cmk-agent                     # TLS registration state
    ports:
      - "6556:6556"     # agent transport (firewall: Checkmk server only)
      - "9180:9180"     # screenshots (token-auth; firewall: operator LAN)
      - "9181:9181"     # management dashboard (token sign-in; operator LAN)
    security_opt:
      - no-new-privileges:true
      # Keep Docker's DEFAULT seccomp profile — do NOT add `seccomp:unconfined`.
      # Chromium runs with --no-sandbox in here, which (unlike Chromium's own
      # sandbox) needs no relaxed seccomp, so the restrictive default stays on.
    cap_drop:
      - ALL
    cap_add:
      # Only what the entrypoint's root -> pwuser privilege drop requires;
      # everything else (NET_RAW, NET_ADMIN, SYS_ADMIN, SYS_PTRACE, ...) is gone.
      - CHOWN          # chown the mounted volumes + stage the secrets copy
      - DAC_OVERRIDE   # write the runner-owned 0600 secrets/audit files
      - FOWNER         # install(1) over a pre-owned bind-mounted file
      - SETUID         # setpriv --reuid pwuser  (drop browser/HTTP to non-root)
      - SETGID         # setpriv --regid pwuser --clear-groups
    # No NET_RAW => the node cannot craft raw packets to port-scan the internal
    # range, even if a (trusted, operator-authored) flow target turns hostile.
    # Official-agent mode (cmk-agent-ctl) runs fine with this set: it only binds
    # a unix socket and opens an outbound TLS connection, needing no extra caps.
    # Headless Chromium under --disable-dev-shm-usage still benefits from
    # a real /dev/shm at higher concurrency.
    shm_size: 1g
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 6g
          pids: 1024   # fork-bomb ceiling for the browser pool (chromium+ff+webkit x4)
    restart: unless-stopped

volumes:
  synthmk-shots:
  cmk-agent-state:
