# SynthMK LAN lab — full end-to-end on one machine.
#
#   checkmk        self-hosted Checkmk Raw (free), the monitoring server + UI
#   synthmk-runner the runner-node appliance (built from this repo)
#   intranet-demo  an "internal only" site, reachable ONLY on the lab network
#                  (not published to the host) — the thing we synthetically check
#
# Quick start:  docs/lan-quickstart.md
#   docker compose up -d --build
#   docker compose logs checkmk | grep -i password     # cmkadmin password
#   open http://localhost:8080/cmk/
name: synthmk-lab

services:
  checkmk:
    image: checkmk/check-mk-raw:2.3.0-latest
    container_name: cmk
    hostname: cmk
    ports:
      - "8080:5000"      # web UI  -> http://localhost:8080/cmk/
      - "8000:8000"      # agent receiver (not required for the plaintext lab)
    environment:
      - CMK_SITE_ID=cmk
      - CMK_PASSWORD=synthmk-lab-admin   # cmkadmin password (lab only)
    tmpfs:
      - /opt/omd/sites/cmk/tmp:uid=1000,gid=1000
    volumes:
      - cmk-data:/omd/sites
    ulimits:
      nofile:
        soft: 1024
        hard: 4096
    networks: [labnet]
    restart: unless-stopped

  synthmk-runner:
    build:
      context: ..                       # repo root
      dockerfile: runner-node/Dockerfile
    image: synthmk-runner:0.7.0
    container_name: synthmk-runner
    hostname: synthmk-runner
    environment:
      # Base URL the OPERATOR's browser uses to open screenshot links. 9180 is
      # published below. Defaults to localhost (testing on the lab host); set
      # SYNTHMK_SHOT_BASE_URL=http://<lan-ip>:9180 to click links from another
      # machine on the LAN. Links carry their own access token (auth stays on
      # in the lab to prove the production path).
      - SYNTHMK_SHOT_BASE_URL=${SYNTHMK_SHOT_BASE_URL:-http://localhost:9180}
      # Secrets for {{ secret.* }} references (the login flow uses them).
      - SYNTHMK_SECRETS_FILE=/run/synthmk/secrets.yaml
      - SYNTHMK_MAX_CONCURRENCY=4
      # Management dashboard sign-in (lab value; production auto-generates a
      # random token when unset — see runner-node/admin_server.py).
      - SYNTHMK_ADMIN_TOKEN=${SYNTHMK_ADMIN_TOKEN:-synthmk-lab-admin}
      # v0.5+: script flows are trust-gated; the lab opts in to demo them.
      - SYNTHMK_ALLOW_SCRIPTS=1
      # v0.5+: read-only dashboard role (lab value).
      - SYNTHMK_VIEWER_TOKEN=${SYNTHMK_VIEWER_TOKEN:-synthmk-lab-viewer}
    volumes:
      # rw in the lab so the dashboard's flow editor can be demonstrated;
      # mount :ro for a view-only dashboard.
      - ./flows:/opt/synthmk/flows
      - ./flows.conf:/opt/synthmk/runner-node/flows.conf
      - ./secrets.yaml:/run/synthmk/secrets.yaml:ro                # lab secrets (chmod 600)
    ports:
      - "9180:9180"      # screenshots (clickable from your browser)
      - "9181:9181"      # management dashboard (token sign-in)
    # 6556 is intentionally NOT published — Checkmk reaches it over labnet by name.
    security_opt:
      - no-new-privileges:true
      # Keep Docker's DEFAULT seccomp profile (never seccomp:unconfined).
      # --no-sandbox Chromium does not need a relaxed profile.
    cap_drop:
      - ALL
    cap_add:
      # Only the caps the entrypoint's root -> pwuser drop needs (see
      # runner-node/compose.yaml for the full rationale). NET_RAW is dropped.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    shm_size: 1g
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 6g
          pids: 1024
    networks: [labnet]
    depends_on: [intranet-demo]
    restart: unless-stopped

  intranet-demo:
    image: nginx:alpine
    container_name: intranet-demo
    hostname: intranet-demo
    volumes:
      - ./intranet-demo/html:/usr/share/nginx/html:ro
    # NO ports: published -> proves the site is reachable only from inside the LAN
    # (only synthmk-runner can hit it; your host and the internet cannot).
    networks: [labnet]
    restart: unless-stopped

networks:
  labnet:
    driver: bridge

volumes:
  cmk-data:
